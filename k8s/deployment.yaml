apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-payments-api
  labels:
    app: fcg-payments-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fcg-payments-api
  template:
    metadata:
      labels:
        app: fcg-payments-api
    spec:
      containers:
      - name: fcg-payments-api
        image: fcg-payments-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: Jwt__Secret
          valueFrom:
            secretKeyRef:
              name: fcg-payments-secret
              key: jwt-secret
        - name: RabbitMQ__Host
          valueFrom:
            configMapKeyRef:
              name: fcg-payments-config
              key: rabbitmq-host
        - name: RabbitMQ__Port
          valueFrom:
            configMapKeyRef:
              name: fcg-payments-config
              key: rabbitmq-port
        - name: RabbitMQ__Username
          valueFrom:
            configMapKeyRef:
              name: fcg-payments-config
              key: rabbitmq-username
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: fcg-payments-secret
              key: rabbitmq-password
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
